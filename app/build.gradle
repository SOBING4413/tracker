plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.tracker.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tracker.app'
        minSdk 24          // Android 7.0
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'BASE_URL', "\"${project.findProperty('trackerBaseUrl')}\""
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signing: configure via env/gradle properties in CI; never commit keystores.
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'   // REST + WebSocket
    implementation 'org.osmdroid:osmdroid-android:6.1.18' // OpenStreetMap, no API key
    testImplementation 'junit:junit:4.13.2'
}
